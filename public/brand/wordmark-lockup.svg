<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <linearGradient id="stickGoldLockup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C45C"/>
      <stop offset="60%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#A67622"/>
    </linearGradient>

    <radialGradient id="snareSkinLockup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B1F23"/>
      <stop offset="100%" stop-color="#101316"/>
    </radialGradient>
  </defs>

  <rect width="920" height="240" fill="#0B0D0F"/>

  <!-- ==================== DRUM EMBLEM (Left) ==================== -->
  <g transform="translate(30, 20)">
    <!-- Outer Hoop -->
    <circle cx="100" cy="100" r="92" fill="url(#snareSkinLockup)" stroke="#262B30" stroke-width="7"/>
    <circle cx="100" cy="100" r="82" fill="none" stroke="#383F47" stroke-width="2"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#262B30" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Lugs -->
    <g fill="#D9A441">
      <rect x="96" y="5" width="8" height="11" rx="2"/>
      <rect x="96" y="184" width="8" height="11" rx="2"/>
      <rect x="5" y="96" width="11" height="8" rx="2"/>
      <rect x="184" y="96" width="11" height="8" rx="2"/>
      <circle cx="33" cy="33" r="4.5"/>
      <circle cx="167" cy="33" r="4.5"/>
      <circle cx="33" cy="167" r="4.5"/>
      <circle cx="167" cy="167" r="4.5"/>
    </g>

    <!-- Crossed Drumsticks -->
    <!-- Left Stick -->
    <g transform="rotate(-34 100 100)">
      <rect x="97" y="36" width="6.5" height="128" rx="2" fill="url(#stickGoldLockup)"/>
      <path d="M97 36 L98.5 20 L101.5 20 L103.5 36 Z" fill="#F2C45C"/>
      <ellipse cx="100" cy="15" rx="4" ry="6" fill="#F5F1E8"/>
    </g>

    <!-- Right Stick -->
    <g transform="rotate(34 100 100)">
      <rect x="97" y="36" width="6.5" height="128" rx="2" fill="url(#stickGoldLockup)"/>
      <path d="M97 36 L98.5 20 L101.5 20 L103.5 36 Z" fill="#F2C45C"/>
      <ellipse cx="100" cy="15" rx="4" ry="6" fill="#F5F1E8"/>
    </g>

    <!-- Center Sweet Spot Impact Ring -->
    <circle cx="100" cy="100" r="14" fill="#0B0D0F" stroke="#D9A441" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="6" fill="#F5F1E8"/>
  </g>

  <!-- SEPARATOR LINE -->
  <line x1="260" y1="40" x2="260" y2="200" stroke="#262B30" stroke-width="1.5"/>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <g transform="translate(295, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="112" 
          font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
          font-weight="900" 
          font-size="62" 
          letter-spacing="6" 
          fill="#F5F1E8">
      ABELE
    </text>

    <!-- Sub-Brand -->
    <text x="3" y="162" 
          font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" 
          font-weight="700" 
          font-size="24" 
          letter-spacing="9" 
          fill="#D9A441">
      DRUMS COACH
    </text>
  </g>
</svg>
